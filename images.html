<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="images.css">
    <title>Images</title>
</head>
<body>
    <header>
        <a class="logo" href="index.html">
            <img src="logo.png" alt="logo" class="logo-chat">
        <span>ChatGPT</span>
        </a>

        <div class="start-box">
            <a class="login" href="#">Log in</a>
            <a class="signup" href="#">Sign up for free</a>
            <button class="help" type="button">?</button>
        </div>
    </header>

    <main>
        <h1>Images</h1>
        <section class="style-section"><h2>Try a style on an image</h2></section>

        <div class="top-arrows">
            <button type="button">‹</button>
            <button type="button">›</button>
        </div>

        <div class="gallery">
            <figure class="style-card">
                <img src="image1.png" alt="">
                <figcaption>Sketch</figcaption>
            </figure>
            
            <figure class="style-card">
                <img src="image2.png" alt="">
                <figcaption>Dramatic</figcaption>
            </figure>

            <figure class="style-card">
                <img src="image3.png" alt="">
                <figcaption>Plushie</figcaption>
            </figure>

            <figure class="style-card">
                <img src="image4.png" alt="">
                <figcaption>Retro anime</figcaption>
            </figure>

            <figure class="style-card">
                <img src="image5.png" alt="">
                <figcaption>Baseball bobblehead</figcaption>
            </figure>

            <figure class="style-card">
                <img src="image6.png" alt="">
                <figcaption>Doodle</figcaption>
            </figure>
        </div>

        <div class="gallery-arrows">
            <button type="button">‹</button>
            <button type="button">›</button>
        </div>

        <section class="discover-section">
            <h2>Discover something new</h2>

            <article class="discover-card">
                <img src="image11.png" alt="">
                <span>Me as The Girl with a Pearl</span>
            </article>

            <article class="discover-card">
                <img src="image22.png" alt="">
                <span>Create a professional product photo</span>
            </article>

            <article class="discover-card">
                <img src="image33.png" alt="">
                <span>Remove people in the background</span>
            </article>

            <article class="discover-card">
                <img src="image44.png" alt="">
                <span>Style me</span>
            </article>

            <article class="discover-card">
                <img src="image55.png" alt="">
                <span>What would I look like as a K-Pop star?</span>
            </article>

            <article class="discover-card">
                <img src="image66.png" alt="">
                <span>Turn into a keychain</span>
            </article>

        </section>
    </main>

    
</body>
</html>
